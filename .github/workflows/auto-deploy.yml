name: Automated pSEO Data Refresh & GitHub Pages Deploy

on:
  push:
    branches: ["main"]
  schedule:
    # Runs automatically every Monday at 06:00 UTC to refresh GitHub stars, releases & freshness dates
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch live GitHub repository telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_github_stats.py

      - name: Commit updated telemetry back to repository (on scheduled runs)
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tools.json data/last-updated.json
          git diff --staged --quiet || git commit -m "chore(data): automated weekly GitHub telemetry update [skip ci]"
          git push

      - name: Build Programmatic SEO Static Site
        run: python3 scripts/build_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
